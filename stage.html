<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>E7 Stage — Projector</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/stage.css" />
  </head>
  <body class="stage-body">
    <header class="stage-top">
      <div class="stage-top__meta">
        <p class="stage-eyebrow">E7 Stage · projector</p>
        <h1 class="stage-title" id="stage-title">Loading…</h1>
        <p class="stage-sub" id="stage-sub"></p>
      </div>
      <div class="stage-qr-block">
        <canvas id="qr-canvas" width="132" height="132" aria-label="QR code for student phones"></canvas>
        <p class="stage-qr-label">Phones · problem only</p>
      </div>
    </header>

    <div class="stage-call" id="stage-call" hidden>
      <div class="stage-call__main">
        <p class="stage-call__label">Calling</p>
        <p class="stage-call__name" id="call-name">Pod</p>
        <p class="stage-call__english" id="call-english"></p>
      </div>
      <div class="stage-timer" id="stage-timer" hidden>
        <span class="stage-timer__label">Consult</span>
        <span class="stage-timer__value" id="timer-value">20</span>
        <span class="stage-timer__unit">s</span>
      </div>
    </div>

    <main class="stage-main">
      <figure class="stage-figure">
        <img id="problem-image" alt="Problem" />
      </figure>
      <figure class="stage-figure stage-figure--sol" id="solution-wrap" hidden>
        <figcaption>Solution</figcaption>
        <img id="solution-image" alt="Solution" />
      </figure>
      <p class="stage-error" id="stage-error" hidden></p>
    </main>

    <footer class="stage-bar">
      <div class="stage-bar__nav">
        <button type="button" class="btn btn--ghost" id="btn-prev" disabled>Prev</button>
        <button type="button" class="btn btn--ghost" id="btn-next" disabled>Next</button>
      </div>
      <div class="stage-bar__actions">
        <button type="button" class="btn btn--primary" id="btn-reveal">Reveal solution (R)</button>
        <button type="button" class="btn btn--ghost" id="btn-hide" hidden>Hide solution</button>
        <a class="btn btn--ghost" id="link-student" href="#" target="_blank" rel="noopener">Open student view</a>
        <a class="btn btn--ghost" id="link-pdf" href="#" target="_blank" rel="noopener" hidden>Source PDF</a>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script>
    <script src="js/stage.js"></script>
  </body>
</html>
