<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>E7 Practice — Problem</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/stage.css" />
  </head>
  <body class="student-body">
    <header class="student-top">
      <p class="stage-eyebrow">E7 · problem only</p>
      <h1 class="student-title" id="student-title">Loading…</h1>
      <p class="student-sub" id="student-sub"></p>
    </header>
    <main class="student-main">
      <figure class="stage-figure">
        <img id="problem-image" alt="Problem" />
      </figure>
      <p class="stage-error" id="stage-error" hidden></p>
      <p class="student-note">
        Solutions stay on the projector. Work with your pod — no peeking.
      </p>
    </main>
    <script src="js/student.js"></script>
  </body>
</html>
