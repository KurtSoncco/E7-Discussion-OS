<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1613" />
    <meta name="color-scheme" content="dark light" />
    <title>E7 Practice — Problem</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/student.css" />
  </head>
  <body class="student-body">
    <div id="empty-state" class="empty-state" hidden>
      <p class="empty-state__eyebrow">E7 discussion</p>
      <h1 class="empty-state__title">Scan the QR on the board</h1>
      <p class="empty-state__body">
        This phone view shows today’s practice problem only. Open the link from the Stage QR — no
        typing needed.
      </p>
    </div>

    <header class="student-top" id="student-header" hidden>
      <p class="student-eyebrow">E7 · problem only</p>
      <p class="student-disc" id="student-disc"></p>
      <h1 class="student-title" id="student-title"></h1>
      <p class="student-sub" id="student-sub"></p>
    </header>

    <main class="student-main" id="student-main" hidden>
      <div class="problem-frame" id="problem-frame">
        <img id="problem-image" alt="Practice problem" decoding="async" />
      </div>
      <p class="student-note">
        Solutions stay on the projector. Pinch to zoom. Work with your pod — no peeking.
      </p>
    </main>

    <p class="student-error" id="student-error" hidden></p>

    <script src="js/student.js"></script>
  </body>
</html>
